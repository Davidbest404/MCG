name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mcg-binaries
          path: dist/