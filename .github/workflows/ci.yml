name: CI

on:
  push:
    branches: [ main, master, Rebuild-with-AI ]
  pull_request:
    branches: [ main, master, Rebuild-with-AI ]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: gcc
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-latest
            name: clang
            cc: clang-16
            cxx: clang++-16
          - os: windows-latest
            name: msvc
            cc: cl
            cxx: cl
          - os: macos-latest
            name: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Configure (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DMCG_BUILD_TESTS=OFF

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake -S . -B build -DMCG_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel