name: CI

on:
  push:
    branches: [ main, master, Rebuild-with-AI ]
  pull_request:
    branches: [ main, master, Rebuild-with-AI ]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: gcc
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-latest
            name: clang
            cc: clang-16
            cxx: clang++-16
          - os: windows-latest
            name: msvc
            cc: cl
            cxx: cl
          - os: macos-latest
            name: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      # --- Ubuntu: обновляем только основные репозитории, чтобы избежать падения apt-get ---
      - name: Install compilers (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y ninja-build gcc-13 g++-13 clang-16

      # --- macOS: принудительно ставим свежий CMake и задаём SDKROOT ---
      - name: Setup CMake (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      - name: Setup CMake (Windows/Linux)
        if: matrix.os != 'macos-latest'
        uses: lukka/get-cmake@latest

      # --- Конфигурация ---
      - name: Configure (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_POLICY_DEFAULT_CMP0169=OLD

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake -S . -B build -DCMAKE_POLICY_DEFAULT_CMP0169=OLD

      # --- Сборка и тесты ---
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
        continue-on-error: true