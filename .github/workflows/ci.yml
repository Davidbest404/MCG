name: CI

on:
  push:
    branches: [ main, master, Rebuild-with-AI ]
  pull_request:
    branches: [ main, master, Rebuild-with-AI ]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: gcc
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-latest
            name: clang
            cc: clang-18      # Изменено
            cxx: clang++-18   # Изменено
          - os: windows-latest
            name: msvc
            cc: cl
            cxx: cl
          - os: macos-latest
            name: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install compilers (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Устанавливаем компиляторы из стандартных репозиториев
          sudo apt-get install -y ninja-build gcc-13 g++-13 clang-18

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Setup SDKROOT (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      - name: Configure (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_OSX_SYSROOT=macosx

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
        continue-on-error: true