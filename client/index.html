<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCG — CDI-AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Экран выбора сервера -->
  <div id="server-list-screen">
    <div class="server-panel">
      <h2>Серверы</h2>
      <ul id="saved-servers"></ul>
      <form id="add-server-form">
        <input id="server-name" placeholder="Название" required>
        <input id="server-url" placeholder="ws://localhost:8080/ws" required>
        <button type="submit">Добавить</button>
      </form>
      <button id="connect-default" class="primary-btn">Быстрое подключение (localhost)</button>
    </div>
  </div>

  <!-- Основной интерфейс игры -->
  <div id="app" style="display: none;">
    <header>
      <span id="status">отключено</span>
      <div style="display:flex; gap:10px;">
        <button id="toggle-hotbar" title="Скрыть/Показать панель">📥 Панель</button>
        <button id="toggle-hud" title="Скрыть/Показать кнопки">👁️ Кнопки</button>
        <button id="toggle-render">2D</button>
      </div>
    </header>
    <main>
      <div id="world-container">
        <canvas id="world"></canvas>
        <div id="hud"></div>
        <div id="hotbar"></div> <!-- Нижняя панель -->
      </div>
      <aside id="side">
		<div id="action-bar"></div>
        <div id="chat-log"></div>
        <form id="chat-form">
          <input id="chat-input" placeholder="Сообщение..." autocomplete="off">
          <button type="submit">➤</button>
        </form>
      </aside>
    </main>
  </div>

  <script src="js/net.js"></script>
  <script src="js/render2d.js"></script>
  <script src="js/render3d.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/servers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
