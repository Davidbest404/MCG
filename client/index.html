<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCG — CDI-AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="server-list-screen">
    <div class="server-panel">
      <h2>Серверы</h2>
      <ul id="saved-servers"></ul>
      <form id="add-server-form">
        <input id="server-name" placeholder="Название" required>
        <input id="server-url" placeholder="ws://localhost:8080/ws" required>
        <button type="submit">Добавить</button>
      </form>
      <button id="connect-default" class="primary-btn">Быстрое подключение (localhost)</button>
    </div>
  </div>

  <div id="app" style="display: none;">
    <header>
      <div style="display:flex; align-items:center; gap: 15px;">
        <span id="server-title" style="font-weight:bold; font-size: 18px;">Сервер</span>
        <span id="server-ip" class="blurred" title="Нажмите, чтобы показать">IP: xxx.xxx.xxx.xxx</span>
        <span id="status" style="color: #f44336;">отключено</span>
      </div>
      <div style="display:flex; gap:10px;">
        <span id="player-name" style="color:#4caf50; font-weight:bold; margin-right: 10px;"></span>
        <button id="toggle-editor">✏️ Редактор</button>
        <button id="toggle-hotbar">📥 Панель</button>
        <button id="toggle-hud">👁️ Кнопки</button>
        <button id="toggle-render">2D</button>
      </div>
    </header>
    <main>
      <div id="world-container">
        <canvas id="world"></canvas>
        <div id="hud">
		  <div id="mobile-dpad">
          <button class="dpad-btn" id="dpad-up">▲</button>
          <button class="dpad-btn" id="dpad-left">◀</button>
          <button class="dpad-btn" id="dpad-down">▼</button>
          <button class="dpad-btn" id="dpad-right">▶</button>
        </div>
		</div>
        <div id="hotbar"></div>
      </div>
      <aside id="side">
        <div id="chat-log"></div>
        <form id="chat-form">
          <input id="chat-input" placeholder="Сообщение..." autocomplete="off">
          <button type="submit">➤</button>
        </form>
      </aside>
    </main>
  </div>

  <div id="editor-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Редактор кнопок</h3>
      <form id="add-btn-form">
        <input id="btn-label" placeholder="Название (например: Привет)" required>
        <input id="btn-command" placeholder="Команда (например: !hello)" required>
        <input id="btn-key" placeholder="Клавиша (например: KeyW, Space, KeyF)" optional>
        <button type="submit">Добавить кнопку</button>
      </form>
      <hr>
      <ul id="custom-btn-list"></ul>
      <button id="close-editor" class="primary-btn" style="background:#f44336; margin-top:10px;">Закрыть</button>
    </div>
  </div>

  <div id="auth-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Вход в игру</h3>
      <form id="auth-form">
        <input id="auth-username" placeholder="Ваше имя" required autocomplete="username">
        <input id="auth-password" type="password" placeholder="Пароль" required autocomplete="current-password">
        <button type="submit" class="primary-btn">Войти / Зарегистрироваться</button>
      </form>
      <div id="auth-error" style="color: #f44336; margin-top: 10px; font-size: 14px;"></div>
    </div>
  </div>

  <script src="js/net.js"></script>
  <script src="js/render2d.js"></script>
  <script src="js/render3d.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/servers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
